name: quality_max
description: 分级路由 + 全过滤；多教师默认关闭以免成本失控。
chunking: {name: semantic_boundary, max_tokens: 768}
anchor: {name: ner_rake_textrank, top_k: 5}
question_gen: {name: anchor_reverse, per_anchor: 2}
evolution: {name: evol_both, sample_ratio: 0.2}
distillation: {name: cot_mixed}
teacher_router: {name: grade_by_qtype}
filters:
  - {name: rule_clean}
  - {name: minhash_dedup, threshold: 0.8}
  - {name: semdedup, threshold: 0.88}
  - {name: nli_fact, pass: 0.8, downgrade: 0.6}
  - {name: llm_judge}
  - {name: knowledge_ablation, f1_drop: 0.8}
  - {name: diversity_sample, quota: {factual: 0.5, explanatory: 0.3, reasoning: 0.2}}
grading: sab
questions_per_chunk: 4
max_samples: 80
seed: 42
teacher_models:
  default: deepseek-chat
  cheap: deepseek-chat
  strong: deepseek-chat
