  - 旧 heldout.jsonl 题干歧义，不可用于主效果结论。
  - 教师为 192.168.4.110:4000 的 qwen3.8-27b。学生是本地 Qwen2.5-7B-Instruct。输入是 60 篇冻结子集，最多 100 个 chunk、150 条样本。
